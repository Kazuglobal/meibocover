version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coverpreview-db
    environment:
      POSTGRES_DB: coverpreview
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: coverpreview-cache
    ports:
      - "6379:6379"

volumes:
  postgres_data: 